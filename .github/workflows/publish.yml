name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# Trusted publishing: npm exchanges this OIDC token for a short-lived
# publish credential, so no long-lived NPM_TOKEN secret is needed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm 11+ is installed with pnpm/setup. pnpm/action-setup only gained
      # pnpm 11 support in v6, and v6's own docs now point pnpm 11+ users at
      # pnpm/setup; this workflow was still on action-setup v4, which predates
      # that support. pnpm/setup also installs Node.js, so actions/setup-node
      # is no longer needed.
      #
      # No NODE_AUTH_TOKEN and no .npmrc auth line are set up on purpose:
      # pnpm 11 detects the GitHub OIDC environment and exchanges its
      # id-token for a short-lived publish token on its own.
      # No dependency cache either: this job holds the OIDC token, and a
      # poisoned store cache would be attacker-controlled code running next
      # to it. Re-add `cache: true` if install time ever matters more.
      - name: Setup pnpm & Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          # Fail if pnpm-lock.yaml is missing or out of sync
          # (runs `pnpm install --frozen-lockfile`).
          require-lockfile: true

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Prereleases must not land on `latest`: derive the dist-tag from the
      # version's prerelease identifier, e.g. v0.0.1-alpha.1 -> alpha,
      # v1.0.0-rc.2 -> rc, v0.1.0 -> latest.
      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION under dist-tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # pnpm 11 publishes natively over OIDC and attaches provenance for
      # public packages from public repositories.
      - name: Publish to npm (OIDC trusted publishing)
        run: pnpm publish --no-git-checks --provenance --tag "${{ steps.dist-tag.outputs.tag }}"
