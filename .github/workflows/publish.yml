name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# Trusted publishing: npm exchanges this OIDC token for a short-lived
# publish credential, so no long-lived NPM_TOKEN secret is needed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # pnpm 11 requires the registry to be written to .npmrc for the
          # OIDC handshake; do NOT set NODE_AUTH_TOKEN here.
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # pnpm 11 publishes natively over OIDC and attaches provenance for
      # public packages from public repositories.
      - name: Publish to npm (OIDC trusted publishing)
        run: pnpm publish --no-git-checks --provenance
